
name: BOOKETIK S5D Auto Seating React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source archives
        shell: bash
        run: |
          unzip -tq BOOKETIK_S4C_CRUD_20261111.zip
          unzip -tq BOOKETIK_S5C_GEOMETRY_SOURCE_20261111.zip
          unzip -tq BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111.zip
          test -s BOOKETIK_FRONTEND_CURRENT_SOURCE.tar.gz

      - name: Extract source kits
        shell: bash
        run: |
          unzip -q BOOKETIK_S4C_CRUD_20261111.zip -d .
          unzip -q BOOKETIK_S5C_GEOMETRY_SOURCE_20261111.zip -d .
          unzip -q BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111.zip -d .

      - name: Test geometry and metric engine
        run: |
          node BOOKETIK_S5C_GEOMETRY_SOURCE_20261111/tests/geometry.mjs
          node BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111/tests/autoseating.mjs
          php BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111/tests/contract.php

      - name: Build React client and SSR
        run: |
          bash BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"

      - name: Export compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: booketik-auto-seating-s5d-compiled
          path: |
            BOOKETIK_S5D_AUTO_SEATING_COMPILED_20261111.tar.gz
            BOOKETIK_S5D_AUTO_SEATING_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
