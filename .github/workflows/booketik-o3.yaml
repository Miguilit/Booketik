
name: BOOKETIK R3-B8-O3 Inline Claim Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private build repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract guarded build kit
        run: |
          unzip -q BOOKETIK_R3B8O3_INLINE_CLAIM_NATIVE_AUTH_BUILD_KIT_20261109.zip

      - name: Compile frontend and SSR
        run: |
          bash o3kit/build.sh \
            "$GITHUB_WORKSPACE/BOOKETIK_R3B8O2_FRONTEND_BUILD_SOURCE_20261109T133219Z.tar.gz" \
            "$GITHUB_WORKSPACE"

      - name: Archive compiled release
        uses: actions/upload-artifact@v4
        with:
          name: booketik-r3b8o3-compiled
          path: |
            BOOKETIK_R3B8O3_COMPILED_FOR_HOSTINGER_20261109.tar.gz
            BOOKETIK_R3B8O3_COMPILED_FOR_HOSTINGER_20261109.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
