
name: BOOKETIK Venue Manager S4C CRUD React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify package
        run: unzip -tq BOOKETIK_S4C_CRUD_20261111.zip

      - name: Unpack S4C
        run: unzip -q BOOKETIK_S4C_CRUD_20261111.zip -d .

      - name: Compile React client and SSR
        run: bash BOOKETIK_S4C_CRUD_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: booketik-venue-manager-s4c-compiled
          path: |
            BOOKETIK_S4C_CRUD_COMPILED_20261111.tar.gz
            BOOKETIK_S4C_CRUD_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
