name: BOOKETIK S6A2 Revision History React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source archives
        shell: bash
        run: |
          for kit in BOOKETIK_S4C_CRUD_20261111 BOOKETIK_S5C_GEOMETRY_SOURCE_20261111 BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111 BOOKETIK_S6A_PUBLICATION_SOURCE_20261111 BOOKETIK_S6A2_HISTORY_SOURCE_20261111; do
            unzip -tq "$kit.zip"
            unzip -q "$kit.zip" -d .
          done
          test -s BOOKETIK_FRONTEND_CURRENT_SOURCE.tar.gz
      - name: Validate S6A2 source
        run: |
          bash BOOKETIK_S6A2_HISTORY_SOURCE_20261111/scripts/verify_source.sh
      - name: Compile React and SSR
        run: bash BOOKETIK_S6A2_HISTORY_SOURCE_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"
      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: booketik-s6a2-history-compiled
          path: |
            BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz
            BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
