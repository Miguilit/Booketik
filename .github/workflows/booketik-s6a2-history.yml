
name: BOOKETIK S6A2 Revision History React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and extract source archives
        shell: bash
        run: |
          set -euo pipefail

          for kit in \
            BOOKETIK_S4C_CRUD_20261111 \
            BOOKETIK_S5C_GEOMETRY_SOURCE_20261111 \
            BOOKETIK_S5D_AUTO_SEATING_SOURCE_20261111 \
            BOOKETIK_S6A_PUBLICATION_SOURCE_20261111 \
            BOOKETIK_S6A2_HISTORY_SOURCE_20261111
          do
            unzip -tq "$kit.zip"
            unzip -q "$kit.zip" -d .
          done

          test -s BOOKETIK_FRONTEND_CURRENT_SOURCE.tar.gz

      - name: Validate S6A2 source
        shell: bash
        run: |
          set -euo pipefail

          bash BOOKETIK_S6A2_HISTORY_SOURCE_20261111/scripts/verify_source.sh

      - name: Compile React client and SSR
        shell: bash
        run: |
          set -euo pipefail

          bash BOOKETIK_S6A2_HISTORY_SOURCE_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"

      - name: Verify compiled archive
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c BOOKETIK_S6A2_PUBLICATION_COMPILED_20261111.tar.gz.sha256

          tar -tzf BOOKETIK_S6A2_PUBLICATION_COMPILED_20261111.tar.gz > /dev/null

      - name: Normalize S6A2 artifact name
        shell: bash
        run: |
          set -euo pipefail

          mv \
            BOOKETIK_S6A2_PUBLICATION_COMPILED_20261111.tar.gz \
            BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz

          sha256sum BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz \
            > BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz.sha256

          sha256sum -c BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz.sha256

          echo "S6A2_ARTIFACT_VERIFY=PASS"

      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: booketik-s6a2-history-compiled
          path: |
            BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz
            BOOKETIK_S6A2_HISTORY_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
