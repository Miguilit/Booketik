
name: BOOKETIK Venue Manager S4A React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify kit archive
        shell: bash
        run: |
          test -s BOOKETIK_S4_VENUE_MANAGER_20261111.zip
          unzip -tq BOOKETIK_S4_VENUE_MANAGER_20261111.zip

      - name: Unpack S4A
        run: unzip -q BOOKETIK_S4_VENUE_MANAGER_20261111.zip -d .

      - name: Compile React client and SSR
        run: bash BOOKETIK_S4_VENUE_MANAGER_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"

      - name: Export build
        uses: actions/upload-artifact@v4
        with:
          name: booketik-s4a-venue-manager-compiled
          path: |
            BOOKETIK_S4_VENUE_MANAGER_COMPILED_20261111.tar.gz
            BOOKETIK_S4_VENUE_MANAGER_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
