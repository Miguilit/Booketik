
name: BOOKETIK S5C Geometry Studio React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source kits
        run: |
          unzip -tq BOOKETIK_S4C_CRUD_20261111.zip
          unzip -tq BOOKETIK_S5C_GEOMETRY_SOURCE_20261111.zip
          test -s BOOKETIK_FRONTEND_CURRENT_SOURCE.tar.gz

      - name: Unpack sources
        run: |
          unzip -q BOOKETIK_S4C_CRUD_20261111.zip -d .
          unzip -q BOOKETIK_S5C_GEOMETRY_SOURCE_20261111.zip -d .

      - name: Test geometry contracts
        run: |
          node BOOKETIK_S5C_GEOMETRY_SOURCE_20261111/tests/geometry.mjs

      - name: Build React client and SSR
        run: |
          bash BOOKETIK_S5C_GEOMETRY_SOURCE_20261111/scripts/build_github.sh "$GITHUB_WORKSPACE"

      - name: Publish compiled build
        uses: actions/upload-artifact@v4
        with:
          name: booketik-geometry-s5c-compiled
          path: |
            BOOKETIK_S5C_GEOMETRY_COMPILED_20261111.tar.gz
            BOOKETIK_S5C_GEOMETRY_COMPILED_20261111.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
