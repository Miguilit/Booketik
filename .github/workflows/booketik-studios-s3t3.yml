
name: BOOKETIK Studios S3 T3 React

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack S3T3 kit
        run: unzip -q BOOKETIK_S3T3_NATIVE_20261110.zip -d .

      - name: Build React client and SSR
        run: bash BOOKETIK_S3T3_NATIVE_20261110/scripts/build_react.sh "$GITHUB_WORKSPACE"

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: booketik-studios-s3t3-compiled
          path: |
            BOOKETIK_STUDIOS_S3T3_COMPILED_20261110.tar.gz
            BOOKETIK_STUDIOS_S3T3_COMPILED_20261110.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
