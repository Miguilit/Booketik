
name: BOOKETIK R3-B8-O4-N2 FR-NL MVP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify sources and kit
        run: |
          set -euo pipefail
          echo '181cbe78ccfa1668c0fb8efec4377ad0faf9980cb42bb9bc38fedb5ed361a92f  BOOKETIK_R3B8O2_FRONTEND_BUILD_SOURCE_20261109T133219Z.tar.gz' | sha256sum -c -
          echo 'a7bf541b0df34d2e9b7f341cb9421d35386f4c4cbec3624bf7ac4c2c5d074709  BOOKETIK_R3B8O4_N2_FR_NL_MVP_BUILD_KIT_20261110.zip' | sha256sum -c -

      - name: Extract translation kit
        run: |
          unzip -q BOOKETIK_R3B8O4_N2_FR_NL_MVP_BUILD_KIT_20261110.zip

      - name: Build frontend and SSR
        run: |
          bash n2kit/build.sh \
            "$GITHUB_WORKSPACE/BOOKETIK_R3B8O2_FRONTEND_BUILD_SOURCE_20261109T133219Z.tar.gz" \
            "$GITHUB_WORKSPACE"

      - name: Upload compiled release
        uses: actions/upload-artifact@v4
        with:
          name: booketik-r3b8o4-n2-fr-nl-compiled
          path: |
            BOOKETIK_R3B8O4_N2_MVP_FR_NL_COMPILED_20261110.tar.gz
            BOOKETIK_R3B8O4_N2_MVP_FR_NL_COMPILED_20261110.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
